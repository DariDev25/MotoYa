<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reportes</title>
  </head>
  <body>
    <!-- Encabezado de la pagina -->
    <header>
      <h1>Reporte de ingresos</h1>
      <button><img src="" alt="icono de campana" /></button>
    </header>
    <!-- Contenido principal de la pagina -->
    <main>
        <!-- Filtro de ingresos -->
      <section>
        <label for="">Filtrar por:</label>
        <select name="" id="">
            <option value="">Esta semana</option>
            <option value="">Este mes</option>
            <option value="">Mes pasado</option>
            <option value="">Este año</option>
        </select>
      </section>
      <!-- Seccion de ingresos totales -->
      <section>
        <div>
            <h2>Ingresos totales</h2>
            <span>RD$ 245,600.00</span>
            
            <!-- sub-bloque -->
            <div>
                <!-- sub-tarjeta efectivo -->
                <div>
                    <h3>Efectivo</h3>
                    <span>RD$ 150,800.00</span>
                </div>
                 <!-- sub-tarjeta tarjeta/online -->
                <div>
                    <h3>Tarjeta/Online</h3>
                    <span>RD$ 94,800.00</span>
                </div>
            </div>        
        </div>
        <!-- Contenedor del grafico -->
        <div>
            <h2>Resumen diario</h2>
            <!-- Grafico de ingresos -->
             <div>
                <img src="" alt="grafico de ingresos" />
             </div>
        </div>
      </section>
    </main>
    <footer>
        <!-- Barra de navegación inferior -->
      <nav>
        <ul>
          <li><a href="#">Dashboard</a></li>
          <li><a href="#">Pedidos</a></li>
          <li><a href="#">Clientes</a></li>
          <li><a href="#">Reportes</a></li>
          <li><a href="#">Ajustes</a></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
