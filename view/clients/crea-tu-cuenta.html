<!DOCTYPE html>
<html lang="es" class="html">
<head class="head">
  <meta class="meta" charset="UTF-8">
  <meta class="meta" name="viewport" content="width=device-width, initial-scale=1.0">
  <title class="title">Crea tu cuenta</title>
</head>
<body class="body registro">
  <header class="header registro-header">
    <h1 class="h1 registro-titulo">Crea tu cuenta</h1>
    <p class="p registro-subtitulo">completa tus datos para comenzar</p>
  </header>

  <main class="main registro-main">
    <form class="form registro-form">
      <div class="div campo campo-nombre">
        <span class="span campo-icono"></span>
        <input class="input campo-input" type="text" name="nombre" placeholder="Nombre completo">
      </div>

      <div class="div campo campo-correo">
        <span class="span campo-icono"></span>
        <input class="input campo-input" type="email" name="correo" placeholder="Correo electrónico">
      </div>

      <div class="div campo campo-telefono">
        <span class="span campo-icono"></span>
        <input class="input campo-input" type="tel" name="telefono" placeholder="Teléfono">
      </div>

      <div class="div campo campo-password">
        <span class="span campo-icono"></span>
        <input class="input campo-input" type="password" name="password" placeholder="Contraseña">
        <span class="span campo-ojo"></span>
      </div>

      <div class="div campo campo-confirmar">
        <span class="span campo-icono"></span>
        <input class="input campo-input" type="password" name="confirmar" placeholder="Confirmar Contraseña">
        <span class="span campo-ojo"></span>
      </div>

      <label class="label registro-terminos">
        <input class="input terminos-check" type="checkbox" name="terminos">
        <span class="span terminos-texto">Acepto los terminos y Condiciones y la Política de Privacidad</span>
      </label>

      <a class="link btn-principal" href="pedidos.html">Crear cuenta</a>
    </form>
  </main>
</body>
</html>
