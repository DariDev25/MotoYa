<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envio</title>
</head>
<body>
    <header>
        <img src="" alt="icono de volver atras" />
        <h1>Hacer un envio</h1>
    </header>

    <main>
        <!-- Seccion de direccion del paquete -->
         <section>
            <h2>Direccion de recogida</h2>
            <span>Selecciona un lugar</span>
            <!-- Tarjeta de direccion -->
            <div>
                <h3>Casa</h3>
                <img src="" alt="icono de usuario">
                <span>Calle principal #123</span>
            </div>

            <h2>Direccion de entrega</h2>
            <span>A donde vamos?</span>
         </section>

         <section>
            <h2>Detalles del paquete</h2>
            <textarea name="" id="" placeholder="Describe tu paquete Ej: documento, ropa, comida..."></textarea>

         </section>

         <section>
            <h2>Tipo de servicio</h2>
            <div>
                <div>
                    <img src="" alt="icono de camion">
                    <span>Envio estandar</span>
                    <input type="radio" name="envio" id="">
                </div>
                
                <div>
                    <img src="" alt="icono de moto">
                    <span>Envio express</span>
                    <input type="radio" name="envio" id="">
                </div>
            </div>
         </section>


    </main>

    <footer>
        <nav>
            <ul>
                <li><a href="">Inicio</a></li>
                <li><a href="">Pedidos</a></li>
                <li><a href="">Mapa</a></li>
                <li><a href="">Perfil</a></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
